<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>ochre dual-theme HTML preview</title><style>:root { --page-bg: #f5f5f5; --page-fg: #111827; --card-bg: #ffffff; }
body { margin:0; padding:24px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--page-bg); color: var(--page-fg); }
.page { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
.toolbar { display:flex; align-items:center; justify-content:center; }
.toggle { display: inline-flex; align-items: center; gap: 10px; }
.toggle input { width:42px; height:24px; }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
#theme-label { display:inline-block; width:5ch; text-align:center; }
pre.ochre { margin: 0; padding: 24px 20px; border-radius: 10px; overflow-x: auto; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }</style></head><body><div class="page"><div class="toolbar"><label class="toggle" for="theme-toggle"><span class="label">Theme</span><input id="theme-toggle" type="checkbox" aria-label="Toggle dark mode" /><span id="theme-label">Light</span></label></div><pre class="ochre ochre-themes light dark" style="background-color:light-dark(#ffffff,#1e1e1e);color:light-dark(#000000,#d4d4d4)" tabindex="0"><code><span class="line"><span style="color:light-dark(#af00db,#c586c0)">let</span><span style="color:light-dark(#000000,#d4d4d4)"> answer = </span><span style="color:light-dark(#098658,#b5cea8)">42</span><span style="color:light-dark(#000000,#d4d4d4)">
</span></span><span class="line"><span style="color:light-dark(#008000,#6a9955)">(* toggle light and dark theme *)</span><span style="color:light-dark(#000000,#d4d4d4)">
</span></span><span class="line"><span style="color:light-dark(#af00db,#c586c0)">let</span><span style="color:light-dark(#000000,#d4d4d4)"> greet = </span><span style="color:light-dark(#a31515,#ce9178)">&quot;hello from ochre&quot;</span></span></code></pre></div><script>(function () {
  var root = document.documentElement;
  var toggle = document.getElementById('theme-toggle');
  var label = document.getElementById('theme-label');
  function setTheme(mode) {
    root.setAttribute('data-theme', mode);
    label.textContent = mode === 'dark' ? 'Dark' : 'Light';
    toggle.checked = mode === 'dark';
  }
  var system = window.matchMedia('(prefers-color-scheme: dark)');
  setTheme(system.matches ? 'dark' : 'light');
  toggle.addEventListener('change', function () {
    setTheme(toggle.checked ? 'dark' : 'light');
  });
})();</script></body></html>
