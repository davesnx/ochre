name: Examples Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - lib/**
      - cli/**
      - docs/**
      - README.mld
      - dune-project
      - test/html-preview.html
      - test/html-dual-theme-preview.html
      - test/latex-preview.tex
      - test/svg-preview.svg
      - test/ansi-preview.txt
      - test/tokens-preview.txt
      - .github/workflows/examples-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: examples-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3.4.5
        with:
          ocaml-compiler: 5.4.0
          dune-cache: true
          opam-disable-sandboxing: true

      - name: Pin dependencies
        run: make pin

      - name: Install opam deps
        run: make install

      - name: Build API documentation
        run: opam exec -- dune build @doc

      - name: Install LaTeX packages and aha
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended aha

      - name: Build LaTeX PDF
        run: |
          mkdir -p _site/examples
          cp test/latex-preview.tex _site/examples/latex-preview.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory _site/examples _site/examples/latex-preview.tex

      - name: Copy previews
        run: |
          cp test/html-preview.html test/html-dual-theme-preview.html test/svg-preview.svg test/tokens-preview.txt _site/examples/
          aha --black --title "ochre ANSI preview" < test/ansi-preview.txt > _site/examples/ansi-preview.html

      - name: Copy API documentation
        run: cp -r _build/default/_doc/_html _site/odoc

      - name: Create examples index page
        run: |
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>ochre examples</title>
            <style>
              :root {
                color-scheme: light;
                font-family: "Iosevka", "JetBrains Mono", "SF Mono", Menlo, monospace;
              }
              body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: radial-gradient(circle at 20% 20%, #fdf6e3 0%, #efe8d8 45%, #e7dfce 100%);
                color: #2f2a23;
              }
              main {
                background: #fffdfa;
                border: 1px solid #d8cdb9;
                border-radius: 14px;
                padding: 24px;
                width: min(680px, calc(100vw - 40px));
                box-shadow: 0 18px 40px rgba(62, 46, 26, 0.12);
              }
              h1 {
                margin: 0 0 8px;
                font-size: 1.4rem;
              }
              h2 {
                margin: 16px 0 8px;
                font-size: 1rem;
              }
              p {
                margin: 0 0 16px;
                line-height: 1.5;
              }
              ul {
                margin: 0;
                padding-left: 18px;
                display: grid;
                gap: 8px;
              }
              a {
                color: #0a5d67;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>ochre</h1>
              <p>Syntax highlighter for OCaml using TextMate grammars and themes.</p>
              <h2>Documentation</h2>
              <ul>
                <li><a href="odoc/ochre/Ochre/index.html">Library API (odoc)</a></li>
                <li><a href="odoc/ochre-cli/index.html">CLI reference</a></li>
              </ul>
              <h2>Rendered examples</h2>
              <ul>
                <li><a href="examples/html-preview.html">HTML preview</a></li>
                <li><a href="examples/html-dual-theme-preview.html">Dual-theme HTML preview</a></li>
                <li><a href="examples/ansi-preview.html">ANSI terminal preview</a></li>
                <li><a href="examples/latex-preview.pdf">LaTeX PDF preview</a> (<a href="examples/latex-preview.tex">source</a>)</li>
                <li><a href="examples/svg-preview.svg">SVG preview</a></li>
                <li><a href="examples/tokens-preview.txt">Tokens output</a></li>
              </ul>
            </main>
          </body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
