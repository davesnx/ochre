name: Examples Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - lib/**
      - cli/**
      - docs/**
      - site/**
      - README.mld
      - dune-project
      - test/html-preview.html
      - test/html-dual-theme-preview.html
      - test/latex-preview.tex
      - test/svg-preview.svg
      - test/ansi-preview.txt
      - test/tokens-preview.txt
      - .github/workflows/examples-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: examples-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.2.0
        with:
          ocaml-compiler: 5.4.0
          pins: |
            odoc-parser https://github.com/davesnx/odoc.git#markdown-types
            odoc https://github.com/davesnx/odoc.git#markdown-types
          with-doc: true
          with-dev-setup: true

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.2.0

      - name: Build API documentation
        run: opam exec -- dune build @doc

      - name: Save dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.2.0

      - name: Install LaTeX packages and aha
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended aha

      - name: Build LaTeX PDF
        run: |
          mkdir -p _site/examples
          cp test/latex-preview.tex _site/examples/latex-preview.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory _site/examples _site/examples/latex-preview.tex

      - name: Build docs site
        run: |
          make docs-site
          cp -r docs/_site/. _site/

      - name: Copy previews
        run: |
          cp test/html-preview.html test/html-dual-theme-preview.html test/svg-preview.svg test/tokens-preview.txt _site/examples/
          aha --black --title "ochre ANSI preview" < test/ansi-preview.txt > _site/examples/ansi-preview.html

      - name: Copy API documentation
        run: cp -r _build/default/_doc/_html _site/odoc

      - name: Disable Jekyll
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
